    <style>
    /* Warm archive scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(20, 20, 19, 0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(197, 158, 95, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(197, 158, 95, 0.5); }

    /* Typewriter caret animation */
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .animate-caret { animation: pulse-subtle 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
