name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18.0", "24"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  container:
    name: Container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Validate configuration
        run: docker compose config --quiet
      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Verify running delivery
        run: node scripts/smoke.mjs http://127.0.0.1:8080 --expect-ai-disabled
      - name: Inspect failed service
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop containers
        if: always()
        run: docker compose down
