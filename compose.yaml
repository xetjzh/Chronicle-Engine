services:
  chronicle:
    image: chronicle-engine:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHRONICLE_PORT:-8080}:5000"
    environment:
      NODE_ENV: production
      API_BACKEND_HOST: 0.0.0.0
      API_BACKEND_PORT: "5000"
      AI_PROXY_ENABLED: "false"
      OPENAI_PROXY_BASE_URL: "${OPENAI_PROXY_BASE_URL:-}"
      OPENAI_PROXY_ALLOWED_ORIGINS: "${OPENAI_PROXY_ALLOWED_ORIGINS:-}"
      SERVE_FRONTEND: "true"
      TRUST_PROXY: "false"
      SHUTDOWN_TIMEOUT_MS: "10000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
